<!DOCTYPE html>
<h:html xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Administrador - 404 Hotel Not Found</title>
        <link href="https://cdn.jsdelivr.net/npm/primeflex@3.2.1/primeflex.min.css" rel="stylesheet" />
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                background: #f5f5f5;
            }

            h1 {
                text-align: center;
                margin-bottom: 2rem;
            }

            .dashboard-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                gap: 1.5rem;
                justify-items: center;
                width: 80%;
            }

            .dashboard-card {
                padding: 1.5rem 2rem;
                border-radius: 1rem;
                color: white;
                font-size: 1.1rem;
                font-weight: bold;
                cursor: pointer;
                transition: transform 0.2s, box-shadow 0.2s;
                width: 100%;
                text-align: center;
            }

            .dashboard-card:hover {
                transform: scale(1.05);
                box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            }
        </style>
    </h:head>
    <h:body>
        <h:form>
            <h1>Panel de Administración</h1>
            <div class="dashboard-grid">
                <p:commandButton styleClass="dashboard-card" style="background:#00aaff;" value="Usuarios" action="usuarios?faces-redirect=true" />
                <p:commandButton styleClass="dashboard-card" style="background:#ff4d4d;" value="Huéspedes" />
                <p:commandButton styleClass="dashboard-card" style="background:#8452ff;" value="Habitaciones" />
                <p:commandButton styleClass="dashboard-card" style="background:#1a237e;" value="Reservas" />
                <p:commandButton styleClass="dashboard-card" style="background:#00c853;" value="Inicio" action="index?faces-redirect=true" />
                <p:commandButton styleClass="dashboard-card" style="background:#ff6d00;" value="Cerrar Sesión" action="#{authController.logout}" />
            </div>
        </h:form>
    </h:body>
</h:html>
