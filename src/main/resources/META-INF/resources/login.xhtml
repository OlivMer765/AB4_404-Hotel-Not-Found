<!DOCTYPE html>
<h:html xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Login 404 Hotel Not Found</title>
        <link href="https://cdn.jsdelivr.net/npm/primeflex@3.2.1/primeflex.min.css" rel="stylesheet" />
    </h:head>
    <h:body class="surface-900 flex flex-column min-h-screen">

        <h:form id="formLogin" class="flex-grow-1 flex align-items-center justify-content-center">
            <p:growl id="growl" life="4000" showDetail="true" />

            <div class="surface-card p-4 shadow-2 border-round w-25rem">
                <div class="text-center">
                    <h2 class="text-black mt-3">Login</h2>
                    <h5 class="text-black mt-3">404 Hotel Not Found</h5>
                </div>
                <div class="mt-4">
                    <div class="field col-12">
                        <span class="p-input-icon-left w-full">
                            <i class="pi pi-envelope"></i>
                            <p:inputText id="correo"
                                         placeholder="Correo Electrónico"
                                         value="#{authController.correo}"
                                         required="true" requiredMessage="Por favor, ingresa tu correo."
                                         class="text-base text-color surface-overlay p-2 border-1 border-solid surface-border border-round appearance-none outline-none focus:border-primary w-full"/>
                        </span>
                        <p:message for="correo" />
                    </div>
                    <div class="field col-12">
                        <span class="p-input-icon-left w-full">
                            <i class="pi pi-lock"></i>
                            <p:password id="contrasena"
                                        placeholder="Contraseña"
                                        toggleMask="true"
                                        value="#{authController.contrasena}"
                                        required="true" requiredMessage="La contraseña es obligatoria."
                                        inputStyleClass="text-base text-color surface-overlay p-2 border-1 border-solid surface-border border-round appearance-none outline-none focus:border-primary w-full"/>
                        </span>
                        <p:message for="contrasena" />
                    </div>
                    <div class="field col-12 mt-3">
                        <p:commandButton value="Iniciar Sesión"
                                         action="#{authController.login}"
                                         update="@form growl"
                                         class="w-full p-button p-button-info mb-3" />
                    </div>
                    <div class="text-center">
                        <p:outputLabel value="¿No tienes cuenta? " class="text-black"/>
                        <h:link value="Regístrate" outcome="register.xhtml" styleClass="nav-link text-blue-200" />
                    </div>
                </div>
            </div>
        </h:form>

        <footer class="bg-gray-900 text-white text-center p-3">
            <p class="m-0">© 2025 404 Hotel Not Found - Todos los derechos reservados</p>
        </footer>

    </h:body>
</h:html>
