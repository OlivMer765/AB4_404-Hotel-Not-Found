<!DOCTYPE html>
<h:html xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Login 404 Hotel Not Found</title>
        <link href="https://cdn.jsdelivr.net/npm/primeflex@3.2.1/primeflex.min.css" rel="stylesheet" />
    </h:head>
    <h:body class="surface-900 flex align-items-center justify-content-center min-h-screen">
        <div class="surface-card p-4 shadow-2 border-round w-25rem"/>
            <div class="text-center">
                <h2 class="text-black mt-3">Login</h2>
                <h5 class="text-black mt-3">404 Hotel Not Found</h5>
            </div>
            <div class="mt-4"/>
                <div class="field col-12">
                    <label for="correo" class="text-white"></label>
                    <p:inputText id="correo" placeholder="Correo" class="text-base text-color surface-overlay p-2 border-1 border-solid surface-border border-round appearance-none outline-none focus:border-primary w-full" />
                </div>
                <div class="field col-12">
                    <label for="contrasena" class="text-white"></label>
                    <p:password id="contrasena" placeholder="Contraseña"
                                class="w-full"
                                inputStyleClass="text-base text-color surface-overlay p-2 border-1 border-solid surface-border border-round appearance-none outline-none focus:border-primary"
                                toggleMask="true" />
                </div>
                <p:commandButton value="Iniciar Sesión" class="w-full p-button p-button-info mb-3" />
        <h:form id="formLogin">
            <div class="surface-card p-4 shadow-2 border-round w-25rem">
                <div class="text-center">
                    <h3 class="text-white mt-3">404 Hotel Not Found</h3>
                </div>
                <div class="mt-4">
                    <div class="field col-12">
                        <p:inputText id="correo"
                                     placeholder="Correo"
                                     class="text-base text-color surface-overlay p-2 border-1 border-solid surface-border border-round appearance-none outline-none focus:border-primary w-full"
                                     value="#{authController.correo}"/>
                    </div>
                    <div class="field col-12">
                        <p:password id="contrasena" placeholder="Contraseña"
                                    class="w-full"
                                    inputStyleClass="text-base text-color surface-overlay p-2 border-1 border-solid surface-border border-round appearance-none outline-none focus:border-primary"
                                    toggleMask="true"
                                    value="#{authController.contrasena}"/>
                    </div>
                    <div class="field col-12 mt-3">
                        <p:commandButton value="Iniciar Sesión"
                                         action="#{authController.login}"
                                         update="@form"
                                         class="w-full p-button p-button-info mb-3" />
                    </div>
                    <div class="text-center">
                        <p:outputLabel value="¿No tienes cuenta? " class="text-white"/>
                        <p:commandLink value="Regístrate" action="register.xhtml" styleClass="nav-link text-blue-200" />
                    </div>
                </div>
            </div>
        </h:form>
    </h:body>
</h:html>
