<!DOCTYPE html>
<h:html xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Registro 404 Hotel Not Found</title>
        <link href="https://cdn.jsdelivr.net/npm/primeflex@3.2.1/primeflex.min.css" rel="stylesheet" />
    </h:head>
    <h:body class="surface-900 flex flex-column min-h-screen">

        <h:form id="formRegistro" class="flex-grow-1 flex align-items-center justify-content-center">
            <p:growl id="growl" life="4000" showDetail="true" />

            <div class="surface-card p-4 shadow-2 border-round w-25rem bg-gray-800">
                <div class="text-center">
                    <h1 class="text-black mt-3">
                        Register
                        <i class="pi pi-user ml-2"></i>
                    </h1>
                    <h5 class="text-black mt-3">404 Hotel Not Found</h5>
                </div>
                <div class="mt-4">
                    <div class="formgrid grid">
                        <div class="field col-12 md:col-6">
                            <span class="p-input-icon-left w-full">
                                <i class="pi pi-user"></i>
                                <p:inputText id="nombre" placeholder="Nombre"
                                             class="text-base text-color surface-overlay p-2 border-1 border-solid surface-border border-round w-full"
                                             value="#{authController.nombre}" required="true" requiredMessage="El nombre es obligatorio."/>
                            </span>
                            <p:message for="nombre" />
                        </div>
                        <div class="field col-12 md:col-6">
                            <span class="p-input-icon-left w-full">
                                <i class="pi pi-user"></i>
                                <p:inputText id="apellido" placeholder="Apellido"
                                             class="text-base text-color surface-overlay p-2 border-1 border-solid surface-border border-round w-full"
                                             value="#{authController.apellido}" required="true" requiredMessage="El apellido es obligatorio."/>
                            </span>
                            <p:message for="apellido" />
                        </div>
                        <div class="field col-12">
                            <span class="p-input-icon-left w-full">
                                <i class="pi pi-envelope"></i>
                                <p:inputText id="correo" placeholder="Correo"
                                             class="text-base text-color surface-overlay p-2 border-1 border-solid surface-border border-round w-full"
                                             value="#{authController.correo}" required="true" requiredMessage="El correo es obligatorio."/>
                            </span>
                            <p:message for="correo" />
                        </div>
                        <div class="field col-12">
                            <span class="p-input-icon-left w-full">
                                <i class="pi pi-phone"></i>
                                <p:inputText id="telefono" placeholder="Teléfono"
                                             class="text-base text-color surface-overlay p-2 border-1 border-solid surface-border border-round w-full"
                                             value="#{authController.telefono}"/>
                            </span>
                            <p:message for="telefono" />
                        </div>
                        <div class="field col-12">
                            <span class="p-input-icon-left w-full">
                                <i class="pi pi-map-marker"></i>
                                <p:inputText id="direccion" placeholder="Dirección"
                                             class="text-base text-color surface-overlay p-2 border-1 border-solid surface-border border-round w-full"
                                             value="#{authController.direccion}"/>
                            </span>
                            <p:message for="direccion" />
                        </div>
                        <div class="field col-12">
                            <span class="p-input-icon-left w-full">
                                <i class="pi pi-key"></i>
                                <p:password id="contrasena" placeholder="Contraseña" toggleMask="true"
                                            class="text-base text-color surface-overlay p-2 border-1 border-solid surface-border border-round w-full"
                                            value="#{authController.contrasena}" required="true" requiredMessage="La contraseña es obligatoria."
                                            feedback="true" weakLabel="Débil" goodLabel="Buena" strongLabel="Fuerte"/>
                            </span>
                            <p:message for="contrasena" />
                        </div>
                        <div class="field col-12">
                             <span class="p-input-icon-left w-full">
                                 <i class="pi pi-check"></i>
                                <p:password id="confirmContrasena" placeholder="Confirmar contraseña" toggleMask="true"
                                            class="text-base text-color surface-overlay p-2 border-1 border-solid surface-border border-round w-full"
                                            required="true" requiredMessage="Debes confirmar tu contraseña."/>
                             </span>
                            <p:message for="confirmContrasena" />
                        </div>
                        <div class="field col-12">
                            <p:commandButton value="Registrar"
                                             action="#{authController.registrar}"
                                             class="w-full p-button p-button-info"
                                             update="@form growl"/>
                        </div>
                    </div>

                    <div class="text-center mt-3">
                        <p:outputLabel value="Ya tienes una cuenta? " class="text-black" />
                        <h:link value="Login" class="text-blue-200" outcome="login.xhtml" />
                    </div>
                </div>
            </div>
        </h:form>

        <footer class="bg-gray-900 text-white text-center p-3">
            <p class="m-0">© 2025 404 Hotel Not Found - Todos los derechos reservados</p>
        </footer>

    </h:body>
</h:html>
