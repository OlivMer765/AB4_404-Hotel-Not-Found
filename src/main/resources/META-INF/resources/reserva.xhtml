<!DOCTYPE html>
<html lang="es" xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Reservas - 404 Hotel Not Found</title>
    <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
</h:head>
<h:body style="min-height:100vh; display:flex; flex-direction:column; background-color:#1a1a1a; color:#f5f5f5;">

    <div class="card mb-3 p-4 surface-card">
        <h:form id="formulario-reservas">
            <p:growl id="mensaje-emergente" showDetail="true"/>

            <div class="card mb-3 surface-card">
                <p:menubar>
                    <p:menuitem value="Inicio" icon="pi pi-fw pi-home"
                                outcome="admin.xhtml"/>
                    <p:submenu label="Principal" icon="pi pi-home" >
                        <p:menuitem value="Huéspedes" icon="pi pi-users" outcome="huesped.xhtml"/>
                        <p:menuitem value="Habitaciones" icon="pi pi-calendar" outcome="habitacion.xhtml"/>
                        <p:menuitem value="Usuarios" icon="pi pi-id-card" outcome="usuario.xhtml"/>
                    </p:submenu>
                    <p:menuitem value="Nueva Reserva" icon="pi pi-fw pi-plus"
                                actionListener="#{reservaController.agregarReserva()}"
                                update="formulario-modal:ventana-reserva"
                                oncomplete="PF('ventanaModalReserva').show()"/>
                </p:menubar>
            </div>

            <div class="card surface-card">
                <p:dataTable value="#{reservaController.reservas}" var="reserva" id="tabla-reservas"
                             widgetVar="tablaReserva" rows="10" paginator="true"
                             rowKey="#{reserva.idReserva}" selectionMode="single"
                             selection="#{reservaController.reservaSelecionada}">
                    <f:facet name="header">
                        <div class="flex justify-content-center flex-wrap card-container">
                            <div class="flex align-items-center justify-content-center w-rem20 h4rem surface-card font-bold m-2 border-round px-4">
                                <h3>Registro de Reservas - 404 Hotel Not Found</h3>
                            </div>
                        </div>
                    </f:facet>

                    <p:column headerText="ID">
                        <h:outputText value="#{reserva.idReserva}"/>
                    </p:column>

                    <p:column headerText="Fecha Entrada">
                        <h:outputText value="#{reserva.fechaEntrada}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Fecha Salida">
                        <h:outputText value="#{reserva.fechaSalida}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Huésped">
                        <h:outputText value="#{reserva.huesped.nombre} #{reserva.huesped.apellido}"/>
                    </p:column>

                    <p:column headerText="Habitación">
                        <h:outputText value="ID: #{reserva.habitacion.idHabitacion} - Tipo: #{reserva.habitacion.tipo} - Estado: #{reserva.habitacion.estado}"/>
                    </p:column>

                    <p:column headerText="C.R.U.D.">
                        <div class="flex gap-2">
                            <p:commandButton value="Editar" icon="pi pi-pencil"
                                             update=":formulario-modal:ventana-reserva"
                                             process="@this"
                                             oncomplete="PF('ventanaModalReserva').show()"
                                             class="ui-button-primary">
                                <f:setPropertyActionListener value="#{reserva}" target="#{reservaController.reservaSelecionada}"/>
                            </p:commandButton>

                            <p:commandButton value="Eliminar" icon="pi pi-trash"
                                             class="ui-button-danger"
                                             process="@this"
                                             oncomplete="PF('ventanaEliminarReserva').show()">
                                <f:setPropertyActionListener value="#{reserva}" target="#{reservaController.reservaSelecionada}"/>
                            </p:commandButton>
                        </div>
                    </p:column>
                </p:dataTable>
            </div>
        </h:form>

        <h:form id="formulario-modal">
            <p:dialog header="Detalle de Reserva" showEffect="fade" modal="true" widgetVar="ventanaModalReserva" responsive="true">
                <p:outputPanel id="ventana-reserva" class="ui-fluid">

                    <div class="field">
                        <p:outputLabel for="fechaEntrada" value="Fecha Entrada:" />
                        <p:calendar id="fechaEntrada" value="#{reservaController.reservaSelecionada.fechaEntrada}" pattern="yyyy-MM-dd HH:mm" showTime="true" required="true"/>
                    </div>

                    <div class="field">
                        <p:outputLabel for="fechaSalida" value="Fecha Salida:" />
                        <p:calendar id="fechaSalida" value="#{reservaController.reservaSelecionada.fechaSalida}" pattern="yyyy-MM-dd HH:mm" showTime="true" required="true"/>
                    </div>

                    <div class="field">
                        <p:outputLabel for="huesped" value="Huésped:" />
                        <p:selectOneMenu id="huesped" value="#{reservaController.selectedHuespedId}"
                                         required="true" filter="true" filterMatchMode="contains">
                            <f:selectItem itemLabel="Selecciona un Huésped" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{reservaController.huespedesDisponibles}" var="h"
                                           itemLabel="#{h.nombre} #{h.apellido} (ID: #{h.idHuesped})" itemValue="#{h.idHuesped}"/>
                        </p:selectOneMenu>
                    </div>

                    <div class="field">
                        <p:outputLabel for="habitacion" value="Habitación:" />
                        <p:selectOneMenu id="habitacion" value="#{reservaController.selectedHabitacionId}"
                                         required="true" filter="true" filterMatchMode="contains">
                            <f:selectItem itemLabel="Selecciona una Habitación" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{reservaController.habitacionesDisponibles}" var="hab"
                                           itemLabel="ID: #{hab.idHabitacion} - Tipo: #{hab.tipo} - Estado: #{hab.estado}" itemValue="#{hab.idHabitacion}"/>
                        </p:selectOneMenu>
                    </div>
                </p:outputPanel>

                <f:facet name="footer">
                    <p:commandButton value="Guardar" icon="pi pi-check" process="ventana-reserva @this"
                                     actionListener="#{reservaController.guardarReserva()}"
                                     update="formulario-reservas:mensaje-emergente formulario-reservas:tabla-reservas"
                                     oncomplete="if (!args.validationFailed) PF('ventanaModalReserva').hide()"/>
                    <p:commandButton value="Cancelar" icon="pi pi-times" onclick="PF('ventanaModalReserva').hide()" class="ui-button-secondary" type="button" />
                </f:facet>
            </p:dialog>

            <p:confirmDialog widgetVar="ventanaEliminarReserva" showEffect="fade" width="300" message="¿Desea eliminar la reserva?" header="Confirmar" severity="warn">
                <p:commandButton value="Sí" icon="pi pi-check" process="@this" actionListener="#{reservaController.eliminarReserva()}"
                                 oncomplete="PF('ventanaEliminarReserva').hide()"
                                 update="formulario-reservas:mensaje-emergente formulario-reservas:tabla-reservas"/>
                <p:commandButton value="No" icon="pi pi-times" onclick="PF('ventanaEliminarReserva').hide()" styleClass="ui-button-secondary" type="button"/>
            </p:confirmDialog>
        </h:form>
    </div>

    <footer style="background-color:#1a1a1a; color:#f5f5f5; text-align:center; padding:1rem; margin-top:auto;">
        <p class="m-0">© 2025 404 Hotel Not Found - Todos los derechos reservados</p>
    </footer>
</h:body>
</html>
